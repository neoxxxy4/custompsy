  <!-- checkmark: white outline + blue -->
  <path d="M166 300 L240 376 L392 184" fill="none" stroke="#f5f7fa" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 300 L240 376 L392 184" fill="none" stroke="#2e86ff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
