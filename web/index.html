    <script>
      // тема применяется до первого рендера, чтобы не мигала
      (function () {
        var t = 'blueprint';
        try { t = JSON.parse(localStorage.getItem('aod2-theme')) || 'blueprint'; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 99998;
        background: #0e1621;

        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
