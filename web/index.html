<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архитектор — система осознанного доверия</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/webp" sizes="192x192" href="/icon-moon-192.webp" />
    <link rel="apple-touch-icon" href="/icon-moon-180.webp" />
    <script>
      // тема применяется до первого рендера, чтобы не мигала
      (function () {
        var t = 'blueprint';
        try { t = JSON.parse(localStorage.getItem('aod2-theme')) || 'blueprint'; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 99998;
        background: #050100;
        color: #8a8577;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 15px;
      }
      #boot-fallback img {
        width: 84px;
        height: 84px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback"><img id="boot-logo" src="/icon-moon-512.webp" alt="Проводник" /><div>Проводник</div></div>
    <script>
      // иконка загрузки по выбранной в настройках
      (function () {
        try {
          var id = JSON.parse(localStorage.getItem('aod4-app-icon')) || 'moon';
          var img = document.getElementById('boot-logo');
          if (img) img.src = '/icon-' + id + '-512.webp';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
