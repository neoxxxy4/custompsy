<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Архитектор — система осознанного доверия</title>
    <script>
      // тема применяется до первого рендера, чтобы не мигала
      (function () {
        var t = 'blueprint';
        try { t = JSON.parse(localStorage.getItem('aod2-theme')) || 'blueprint'; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
